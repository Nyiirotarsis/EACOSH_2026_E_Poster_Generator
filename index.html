<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EACOSH 2026 | E-Poster Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#061B34;
    --navy2:#082B4A;
    --blue:#0877A5;
    --cyan:#19A9C8;
    --teal:#00A99D;
    --orange:#F47721;
    --yellow:#F4C62A;
    --gold:#D8B43A;
    --cream:#F7F5EF;
    --ink:#07121E;
    --muted:#7890A4;
    --panel:#0B2038;
    --line:rgba(216,180,58,.24);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:#03101f;color:#fff;font-family:"DM Sans",Arial,sans-serif;
    min-height:100vh;
  }
  header{
    height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08);
    background:#07182c;position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:36px;height:36px;border-radius:8px;background:var(--yellow);color:var(--navy);
    display:grid;place-items:center;font-weight:800;font-size:15px;
  }
  .brand-title{font-weight:700;letter-spacing:.04em}
  .brand-sub{font-size:11px;color:#9eb0c0;margin-top:2px}
  button{
    border:0;font:inherit;cursor:pointer
  }
  .download{
    background:var(--yellow);color:var(--navy);padding:11px 16px;border-radius:7px;
    font-weight:700;display:flex;gap:8px;align-items:center
  }
  .layout{display:flex;min-height:calc(100vh - 64px)}
  aside{
    width:310px;flex:0 0 310px;background:#07182c;border-right:1px solid rgba(255,255,255,.07);
    padding:20px;overflow:auto
  }
  main{
    flex:1;display:flex;align-items:center;justify-content:center;padding:28px;
    background:radial-gradient(circle at 50% 35%,#0b2340 0,#040d19 48%,#020812 100%);
    overflow:auto
  }
  .section{margin-bottom:20px}
  label{
    display:block;text-transform:uppercase;letter-spacing:.13em;font-size:10px;
    color:#c9b15a;margin-bottom:8px;font-weight:700
  }
  input[type=text], select{
    width:100%;background:#0c2544;border:1px solid rgba(216,180,58,.25);
    color:#fff;border-radius:6px;padding:11px 12px;outline:none
  }
  input[type=text]:focus,select:focus{border-color:rgba(216,180,58,.75)}
  .upload{
    width:100%;min-height:108px;border:2px dashed rgba(216,180,58,.35);
    background:#091f38;color:#cdbb75;border-radius:8px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px
  }
  .upload small{font-size:10px;opacity:.65}
  input[type=file]{display:none}
  .range-row{display:flex;align-items:center;gap:10px}
  input[type=range]{width:100%;accent-color:var(--yellow)}
  .value{min-width:42px;text-align:right;color:#f2d45a;font-size:12px}
  .hint{
    margin-top:16px;padding:12px;border:1px solid rgba(216,180,58,.13);
    background:rgba(216,180,58,.05);border-radius:7px;color:#8ea0b2;font-size:11px;line-height:1.55
  }
  .poster-wrap{width:min(540px,72vw);aspect-ratio:1080/1350}
  canvas{
    width:100%;height:100%;display:block;background:#fff;
    box-shadow:0 22px 70px rgba(0,0,0,.5);border-radius:4px
  }
  .mobile-download{display:none}
  input[type=checkbox]{accent-color:var(--yellow);width:15px;height:15px}
  @media(max-width:800px){
    header{height:auto;min-height:60px}
    .layout{flex-direction:column}
    aside{width:100%;flex:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.07)}
    main{padding:16px;min-height:70vh}
    .poster-wrap{width:min(540px,94vw)}
    .download{display:none}
    .mobile-download{display:flex;width:100%;justify-content:center;margin-top:10px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">E</div>
    <div>
      <div class="brand-title">EACOSH 2026</div>
      <div class="brand-sub">E-Poster Generator</div>
    </div>
  </div>
  <button class="download" onclick="downloadPoster()">⇩&nbsp; Download PNG</button>
</header>

<div class="layout">
  <aside>
    <div class="section">
      <label>Your Photo</label>
      <label for="photo" class="upload">
        <div style="font-size:24px">↥</div>
        <div>Click to upload photo</div>
        <small>JPG, PNG, WEBP</small>
      </label>
      <input id="photo" type="file" accept="image/*">
    </div>

    <div class="section">
      <label>Full Name</label>
      <input id="name" type="text" maxlength="48" placeholder="Your Name" value="">
    </div>

    <div class="section">
      <label>Title / Role</label>
      <input id="role" type="text" maxlength="52" placeholder="Your Title / Organisation" value="">
    </div>

    <div class="section">
      <label>Tagline / Hashtag</label>
      <input id="tagline" type="text" maxlength="60" value="#EACOSH2026">
    </div>

    <div class="section">
      <label>Photo Position &amp; Zoom</label>
      <div class="range-row" style="margin-bottom:8px">
        <span style="font-size:11px;color:#9eb0c0;min-width:34px">X</span>
        <input id="photoX" type="range" min="-180" max="180" step="2" value="0">
        <span class="value" id="photoXValue">0</span>
      </div>
      <div class="range-row" style="margin-bottom:8px">
        <span style="font-size:11px;color:#9eb0c0;min-width:34px">Y</span>
        <input id="photoY" type="range" min="-180" max="180" step="2" value="0">
        <span class="value" id="photoYValue">0</span>
      </div>
      <div class="range-row">
        <span style="font-size:11px;color:#9eb0c0;min-width:34px">Zoom</span>
        <input id="photoZoom" type="range" min="0.70" max="1.60" step="0.02" value="1">
        <span class="value" id="photoZoomValue">100%</span>
      </div>
      <button type="button" onclick="resetPhotoPosition()" style="margin-top:9px;width:100%;padding:8px;border:1px solid rgba(216,180,58,.22);border-radius:6px;background:#0c2544;color:#d8c56f;font-size:11px;font-weight:700">↺ Center Photo</button>
    </div>

    <div class="section">
      <label>Safety Week PPE</label>
      <div style="display:grid;gap:7px;font-size:11px;color:#c7d2dc">
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:#c7d2dc;font-size:11px;margin:0">
          <input id="helmet" type="checkbox"> Safety helmet
        </label>
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:#c7d2dc;font-size:11px;margin:0">
          <input id="vest" type="checkbox"> Reflective vest
        </label>
        <label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;color:#c7d2dc;font-size:11px;margin:0">
          <input id="goggles" type="checkbox"> Safety goggles
        </label>
        <div style="font-size:10px;color:#8295a7;margin-top:3px">PPE appears on the poster only when selected.</div>
      </div>
    </div>

    <div class="section">
      <label>Poster Font</label>
      <select id="font">
        <option value="Playfair Display">Playfair Display</option>
        <option value="DM Sans">DM Sans</option>
      </select>
    </div>

    <div class="section">
      <label>Name Font Size</label>
      <div class="range-row">
        <input id="fontSize" type="range" min="42" max="68" step="2" value="54">
        <span class="value" id="fontSizeValue">54px</span>
      </div>
    </div>

    <button class="download mobile-download" onclick="downloadPoster()">⇩&nbsp; Download PNG</button>

    <div class="hint">
      Poster exports at <strong>1080 × 1350 px</strong>, suitable for Instagram, LinkedIn,
      WhatsApp sharing and digital display. The event information is based on the supplied
      EACOSH Conference 2026 artwork.
    </div>
  </aside>

  <main>
    <div class="poster-wrap">
      <canvas id="poster" width="1080" height="1350"></canvas>
    </div>
  </main>
</div>

let photo = null;
let photoScale = 1;
let photoX = 0;
let photoY = 0;

const el = id => document.getElementById(id);

function roundedRect(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
}
function fitText(text, maxWidth, size, family, weight='700'){
  ctx.font = `${weight} ${size}px "${family}"`;
  if(ctx.measureText(text).width <= maxWidth) return size;
  let s=size;
  while(s>22 && ctx.measureText(text).width>maxWidth){s-=1;ctx.font=`${weight} ${s}px "${family}"`}
  return s;
}
function centerText(text,x,y,size,family,color,weight='700'){
  ctx.font=`${weight} ${size}px "${family}"`;
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x,y);
}
function wrapText(text,x,y,maxWidth,lineHeight,size,family,color,weight='400',align='left'){
  ctx.font=`${weight} ${size}px "${family}"`;
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='top';
  const words=text.split(/\s+/);let line='';
  const lines=[];
  for(const word of words){
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=word}else line=test;
  }
  if(line) lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));
  return lines.length*lineHeight;
}
function drawImageCover(img,x,y,w,h){
  const ratio=Math.max(w/img.width,h/img.height);
  const dw=img.width*ratio,dh=img.height*ratio;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function drawImageCircle(img,cx,cy,r){
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
  const s=Math.max((r*2)/img.width,(r*2)/img.height)*photoScale;
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
  ctx.restore();
}
function loadImg(src){
  return new Promise((resolve,reject)=>{
    const im=new Image(); im.onload=()=>resolve(im); im.onerror=reject; im.src=src;
  });
}

function drawSafetyPPE(cx,cy,r){
  const helmet=el('helmet').checked, vest=el('vest').checked, goggles=el('goggles').checked;
  const gearY = photoY * 0.35;
  ctx.save();
  ctx.translate(cx + photoX*0.35, cy + gearY);

  // Reflective safety vest around shoulders / torso
  if(vest){
    ctx.save();
    ctx.globalAlpha=.96;
    ctx.fillStyle='#F7B91E';
    ctx.beginPath();
    ctx.moveTo(-105,115); ctx.lineTo(-60,82); ctx.lineTo(-20,120);
    ctx.lineTo(20,120); ctx.lineTo(60,82); ctx.lineTo(105,115);
    ctx.lineTo(124,190); ctx.lineTo(-124,190); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#FFF4B0';
    ctx.fillRect(-86,120,18,70); ctx.fillRect(68,120,18,70);
    ctx.fillStyle='#4A4A4A';
    ctx.fillRect(-124,150,248,14);
    ctx.restore();
  }

  // Safety goggles across the eye area
  if(goggles){
    ctx.save();
    ctx.globalAlpha=.86;
    ctx.strokeStyle='#D8ECF5'; ctx.lineWidth=6;
    ctx.fillStyle='rgba(40,105,135,.45)';
    ctx.beginPath(); ctx.roundRect(-80,-35,67,43,13); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(13,-35,67,43,13); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13,-14); ctx.lineTo(13,-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-80,-12); ctx.lineTo(-103,-20); ctx.moveTo(80,-12); ctx.lineTo(103,-20); ctx.stroke();
    ctx.restore();
  }

  // Hard hat
  if(helmet){
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=12;
    ctx.fillStyle='#F4C62A';
    ctx.beginPath();
    ctx.moveTo(-96,-100);
    ctx.quadraticCurveTo(-82,-153,0,-164);
    ctx.quadraticCurveTo(82,-153,96,-100);
    ctx.lineTo(112,-89); ctx.quadraticCurveTo(0,-63,-112,-89); ctx.closePath();
    ctx.fill();
    ctx.shadowColor='transparent';
    ctx.fillStyle='#E3B31D';
    ctx.fillRect(-9,-151,18,58);
    ctx.fillStyle='#F9D957';
    ctx.beginPath();ctx.roundRect(-122,-93,244,25,12);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}


function drawPPECampaignRow(y){

  // Helmet icon
  ctx.save(); ctx.translate(335,y-2);
  ctx.fillStyle=yellow; ctx.strokeStyle=navy; ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,25,Math.PI,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(-34,0,68,9,5);ctx.fill();ctx.stroke();
  ctx.fillStyle=orange;ctx.fillRect(-3,-25,6,25); ctx.restore();

  // Vest icon
  ctx.save(); ctx.translate(455,y);

  ctx.strokeStyle='#FFF2A5';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-19,-1);ctx.lineTo(19,-1);ctx.moveTo(-23,15);ctx.lineTo(23,15);ctx.stroke();ctx.restore();

  // Goggles icon
  ctx.save(); ctx.translate(575,y);
  ctx.fillStyle='rgba(16,168,209,.25)';ctx.strokeStyle=teal;ctx.lineWidth=4;

  ctx.beginPath();ctx.roundRect(6,-15,33,29,8);ctx.fill();ctx.stroke();

async function drawPoster(){
  const navy='#06203A', navy2='#07365A', teal='#05A99A', cyan='#10A8D1',
        orange='#F47A21', yellow='#F6C928', cream='#F7F5EE', white='#FFFFFF',
        ink='#061522', grey='#5D6C78';

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=cream;ctx.fillRect(0,0,W,H);

  // Background geometry
  ctx.fillStyle=navy;ctx.fillRect(465,0,615,860);
  ctx.fillStyle=navy2;
  ctx.beginPath();ctx.arc(710,180,430,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=cyan;ctx.globalAlpha=.9;
  ctx.beginPath();ctx.arc(910,-35,240,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=teal;ctx.globalAlpha=.8;
  ctx.beginPath();ctx.arc(1050,110,150,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;

  // Orange sweeping shape
  ctx.fillStyle=orange;
  ctx.beginPath();
  ctx.moveTo(720,610);ctx.bezierCurveTo(860,520,1030,530,1080,630);
  ctx.lineTo(1080,910);ctx.bezierCurveTo(850,840,650,790,520,680);
  ctx.closePath();ctx.fill();

  // Yellow accent
  ctx.fillStyle=yellow;
  ctx.beginPath();ctx.arc(455,310,160,0,Math.PI*2);ctx.fill();

  // EACOSH logo panel
  const logo = await loadImg(eacLogoSrc);
  ctx.save();
  ctx.globalAlpha=.98;
  roundedRect(55,58,340,160,20,white,null);
  drawImageCover(logo,72,72,305,132);
  ctx.restore();

  // Main heading
  centerText('INAUGURAL',775,105,31,'DM Sans',white,'500');
  centerText('EAC OSH',775,150,61,'DM Sans',white,'700');
  centerText('CONFERENCE',775,202,34,'DM Sans',white,'500');
  centerText('2026',775,248,44,'Playfair Display',yellow,'700');

  // Safety Week campaign badge
  roundedRect(620,235,310,42,21,orange,null);
  centerText('SAFETY WEEK CAMPAIGN',775,256,18,'DM Sans',white,'700');

  // Date / venue
  roundedRect(545,280,480,115,18,'rgba(2,17,32,.62)','rgba(255,255,255,.18)',2);
  centerText('27th – 28th AUGUST 2026',785,315,29,'DM Sans',yellow,'700');
  centerText('Imperial Royale Hotel • Kampala, Uganda',785,355,21,'DM Sans',white,'500');

  // Attendance badge: moved into a cleaner gap below the date card
  roundedRect(390,415,300,50,25,orange,null);
  centerText('I AM ATTENDING',540,440,21,'DM Sans',white,'700');

  // Photo circle
  const cx=540, cy=635, r=166;
  ctx.save();
  ctx.shadowColor='rgba(246,201,40,.38)';ctx.shadowBlur=35;
  ctx.beginPath();ctx.arc(cx,cy,r+7,0,Math.PI*2);ctx.strokeStyle=yellow;ctx.lineWidth=7;ctx.stroke();
  ctx.restore();
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#163B62';ctx.fill();

  if(photo){
    ctx.save();
    ctx.translate(photoX,photoY);
    drawImageCircle(photo,cx,cy,r);
    ctx.restore();
  } else {
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.beginPath();ctx.arc(cx,cy-22,58,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx,cy+75,105,Math.PI,Math.PI*2);ctx.fill();
    centerText('UPLOAD PHOTO',cx,cy+9,17,'DM Sans','rgba(255,255,255,.55)','600');
  }

  // Photo ring
  ctx.beginPath();ctx.arc(cx,cy,r+12,0,Math.PI*2);ctx.strokeStyle=yellow;ctx.lineWidth=3;ctx.stroke();

  // Optional PPE overlays. Nothing is shown unless the user toggles it on.
  if(photo && (el('helmet').checked || el('vest').checked || el('goggles').checked)){
    drawSafetyPPE(cx,cy,r);
  }

  // Personal details panel: keep the name area light so black text is never swallowed by navy
  roundedRect(55,785,970,190,18,'#F2EEE3','rgba(6,32,58,.18)',2);
  const family=el('font').value;
  const name=el('name').value.trim() || 'Your Name';
  const role=el('role').value.trim() || 'Your Title / Organisation';
  const tagline=el('tagline').value.trim() || '#EACOSH2026';
  const nameSize=Number(el('fontSize').value);

  let ns=fitText(name,760,nameSize,family,'700');
  roundedRect(125,795,830,68,12,'#E4DCCB',null);
  centerText(name,540,829,ns,family,'#000000','700');
  centerText(role,540,875,26,'DM Sans',orange,'700');

  ctx.strokeStyle='#D2B13B';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(330,908);ctx.lineTo(750,908);ctx.stroke();
  centerText('◆',540,908,13,'DM Sans','#D2B13B','700');
  centerText(tagline,540,945,20,'DM Sans','#56616A','700');

  // Theme block
  ctx.fillStyle=navy;ctx.fillRect(55,1010,570,165);
  ctx.fillStyle=orange;ctx.fillRect(78,1028,190,42);
  centerText('THEME',173,1049,22,'DM Sans',white,'700');
  wrapText(
    'Building Resilient & Inclusive Workplaces: OSH for Formal & Informal Economies',
    82,1088,500,33,25,'DM Sans',white,'700','left'
  );

  // QR + registration
  roundedRect(650,1010,375,165,16,white,'rgba(6,32,58,.12)',1);
  const qr=await loadImg(qrSrc);
  ctx.drawImage(qr,675,1025,130,130);
  ctx.fillStyle=navy;
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='700 21px "DM Sans"';ctx.fillText('REGISTER / LEARN MORE',830,1031);
  ctx.font='600 20px "DM Sans"';ctx.fillStyle=teal;ctx.fillText('eacosha.com',830,1067);
  wrapText('Scan the QR code for the conference website.',830,1103,170,22,15,'DM Sans',grey,'500','left');

  // Footer information
  ctx.fillStyle=white;ctx.fillRect(0,1198,W,152);
  ctx.fillStyle=navy;ctx.fillRect(0,1198,1080,8);

  const logos=await loadImg(logosSrc);
  ctx.drawImage(logos,52,1220,430,98);

  // Contact / social
  ctx.fillStyle=navy;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='700 17px "DM Sans"';ctx.fillText('SOCIAL MEDIA',585,1217);
  const socials=['f','▶','𝕏','in'];
  socials.forEach((s,i)=>{
    const x=595+i*48;
    ctx.fillStyle=navy;ctx.beginPath();ctx.arc(x,1257,16,0,Math.PI*2);ctx.fill();
    centerText(s,x,1257,14,'DM Sans',white,'700');
  });
  ctx.fillStyle='#506170';ctx.font='500 13px "DM Sans"';
  ctx.fillText('+256 776 798 509 / +256 789 570388',585,1282);
  ctx.fillText('info@eacosha.com  •  info@shau.org.ug  •  www.eacosha.com',585,1303);

  // Small pricing line
  ctx.fillStyle=navy;ctx.font='700 12px "DM Sans"';ctx.textAlign='center';
  ctx.fillText('MEMBER: UGX 300,000 EARLY / 350,000 LATE   •   NON-MEMBER: 350,000 / 400,000   •   INTERNATIONAL: 450,000 / 500,000',540,1333);
}

function downloadPoster(){
  const link=document.createElement('a');
  link.download='EACOSH-2026-E-Poster.png';
  link.href=canvas.toDataURL('image/png',1);
  link.click();
}

el('photo').addEventListener('change',e=>{
  const file=e.target.files?.[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const im=new Image();
    im.onload=()=>{photo=im;drawPoster()};
    im.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});
['name','role','tagline','font','helmet','vest','goggles'].forEach(id=>el(id).addEventListener('input',drawPoster));
function updatePhotoControls(){
  photoX=Number(el('photoX').value);
  photoY=Number(el('photoY').value);
  photoScale=Number(el('photoZoom').value);
  el('photoXValue').textContent=photoX;
  el('photoYValue').textContent=photoY;
  el('photoZoomValue').textContent=Math.round(photoScale*100)+'%';
  drawPoster();
}
['photoX','photoY','photoZoom'].forEach(id=>el(id).addEventListener('input',updatePhotoControls));
function resetPhotoPosition(){
  el('photoX').value=0; el('photoY').value=0; el('photoZoom').value=1; updatePhotoControls();
}
el('fontSize').addEventListener('input',()=>{
  el('fontSizeValue').textContent=el('fontSize').value+'px';
  drawPoster();
});

drawPoster();
</script>
